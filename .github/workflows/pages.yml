name: Сборка и публикация сайта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # каждый день в 07:00 по Москве
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  checks:
    # Ежедневный запуск по расписанию код не меняет — проверяем только при изменениях (push, PR, ручной запуск).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright/python:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Установить средства проверки
        timeout-minutes: 8
        run: |
          pip install --retries 2 --timeout 30 playwright==1.64.1 beautifulsoup4==4.12.3
          apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          apt-get install -y --no-install-recommends poppler-utils
      - name: Проверить сайт, калькуляторы и смену размеров экрана
        run: |
          python -m http.server 8766 > /tmp/alenafit-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://localhost:8766/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise RuntimeError('Локальный сервер не запустился')
          PY
          # Браузерные проверки на общих серверах GitHub иногда сбиваются по времени — упавший набор повторяем один раз.
          retry() { "$@" || { echo "::warning::Повтор после сбоя: $*"; "$@"; }; }
          python tests/seo_check.py
          node tests/food_storage.test.cjs
          node tests/nav_resize.test.cjs
          node tests/cycle_diary.test.cjs
          node tests/export.test.cjs
          node tests/recipe_engine.test.cjs
          node tests/online_data.test.cjs
          node tests/nutrition_plan.test.cjs
          node tests/nutrition_targets.test.cjs
          node tests/meal_quality.test.cjs
          node tests/ai_meal_contract.test.cjs
          node tests/ai_meal_pending.test.cjs
          node server/meal-plan/test.mjs
          python tests/ai_installer_test.py
          python tests/nutrition_actions.py
          python tests/simple_actions.py
          python tests/ai_actions.py
          python tests/assistant_actions.py
          retry python tests/regression.py
          retry python tests/audit_regression.py
          retry python tests/technical_regression.py
          retry python tests/mobile_feedback.py
          python tests/mobile_services.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-and-fold-checks
          path: qa-output/
          if-no-files-found: ignore
  build:
    needs: checks
    # По расписанию проверки пропускаются, и новости публикуются; при изменениях кода — только после успешных проверок.
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.checks.result == 'success' || (github.event_name == 'schedule' && needs.checks.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # история нужна для дат в sitemap.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Кэш переводов
        uses: actions/cache@v4
        with:
          path: ~/tr-cache
          key: translations-${{ github.run_id }}
          restore-keys: translations-
      - name: Собрать новости и посты канала
        env:
          TG_CHANNEL: "alena_gymmom"   # ник канала без @
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
          YC_FOLDER_ID: b1g1s0osh5lebv9esn5n   # ID каталога Yandex Cloud, не секрет
        run: |
          pip install feedparser==6.0.11 beautifulsoup4==4.12.3 requests==2.32.3
          python scripts/update_data.py
      - name: Карта сайта для поисковиков
        run: python scripts/build_sitemap.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    # always(): пропущенные проверки по расписанию не должны «протекать» пропуском в публикацию
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
