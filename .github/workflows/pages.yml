name: Сборка и публикация сайта

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # каждый день в 07:00 по Москве
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # история нужна для дат в sitemap.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Кэш переводов
        uses: actions/cache@v4
        with:
          path: ~/tr-cache
          key: translations-${{ github.run_id }}
          restore-keys: translations-
      - name: Собрать новости и посты канала
        env:
          TG_CHANNEL: "alena_gymmom"   # ник канала без @
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
          YC_FOLDER_ID: b1g1s0osh5lebv9esn5n   # ID каталога Yandex Cloud, не секрет
        run: |
          pip install feedparser==6.0.11 beautifulsoup4==4.12.3 requests==2.32.3
          python scripts/update_data.py
      - name: Карта сайта для поисковиков
        run: python scripts/build_sitemap.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
